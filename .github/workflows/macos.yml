# The macOS builds, one on each kind of Mac: Apple silicon (arm64) and Intel
# (x86_64). Each builds the .dmg (./gradlew :desktop:macosDmg), runs the
# CoreMIDI tests and checks the .dmg (desktop/macos/check.sh). On a version
# tag, the release job puts both .dmg files on that tag's GitHub release once
# it exists, with their SHA-256 sums in SHA256SUMS-macos beside them.
name: macOS

on:
  workflow_dispatch:
  push:
    branches: [mac]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # :shared has an Android target, which Gradle configures even for the
      # desktop. The runner images have the Android SDK in ANDROID_HOME.
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build the .dmg
        run: ./gradlew --stacktrace :desktop:macosDmg

      - name: CoreMIDI and Java Sound MIDI tests
        run: ./gradlew :desktop:test --tests 'com.rm.acidulous.desktop.CoreMidiTest' --tests 'com.rm.acidulous.desktop.JavaSoundMidiTest'

      - name: Check the .dmg
        run: desktop/macos/check.sh desktop/build/macos/acidulous-*-macos-${{ matrix.arch }}.dmg ${{ matrix.arch }} checks

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acidulous-macos-${{ matrix.arch }}
          path: desktop/build/macos/acidulous-*-macos-${{ matrix.arch }}.dmg
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-macos-${{ matrix.arch }}
          path: |
            checks
            desktop/build/test-results/test/*.xml
          if-no-files-found: ignore

  # The release is made by hand after the tag is pushed, so this waits for it.
  # The sums are of the same files it uploads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: acidulous-macos-*
          merge-multiple: true
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          v=${TAG#v}
          arm=acidulous-$v-macos-arm64.dmg
          intel=acidulous-$v-macos-x86_64.dmg
          ls -l "$arm" "$intel"
          sha256sum "$arm" "$intel" > SHA256SUMS-macos
          cat SHA256SUMS-macos
          for i in $(seq 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" --clobber \
                "$arm#Acidulous $v for Mac, Apple Silicon (M1 and later)" \
                "$intel#Acidulous $v for Mac, Intel" \
                SHA256SUMS-macos
              exit 0
            fi
            sleep 30
          done
          echo "no release for $TAG after 30 minutes; the .dmg files are in this run's artifacts"
          exit 1
