<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acidulous</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1b1c1f">
<script>
  // Register the service worker (sw.js), which adds the isolation headers a
  // static host can't send and caches the app for offline use and installing.
  // On a first visit it only takes over after a reload, so reload once, in
  // case the browser can't isolate the page at all.
  (() => {
    const tried = (set) => { try { return set ? sessionStorage.setItem('acid-reloaded', '1') : sessionStorage.getItem('acid-reloaded'); } catch (e) { return '1'; } };
    if (window.crossOriginIsolated) { try { sessionStorage.removeItem('acid-reloaded'); } catch (e) {} }
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
    navigator.serviceWorker.register('sw.js').then(() => {
      if (window.crossOriginIsolated) return;
      const again = () => { if (!tried()) { tried(true); location.reload(); } };
      if (navigator.serviceWorker.controller) again();
      else navigator.serviceWorker.addEventListener('controllerchange', again);
    }).catch((e) => console.warn('Acidulous: no service worker', e));
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #1b1c1f; overflow: hidden; }
  /* The status text sits behind the app, which covers it with its first frame. */
  #root { position: relative; z-index: 1; width: 100%; height: 100%; }
  #status { position: fixed; inset: 0; z-index: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; padding: 16px; color: #9a9aa2; font: 15px/1.5 system-ui, sans-serif;
            text-align: center; }
  #bar { width: min(320px, 100%); height: 4px; border-radius: 2px; background: #33333a; overflow: hidden; visibility: hidden; }
  #fill { width: 0; height: 100%; background: #ffb454; transition: width 0.2s; }
  #amount { font-size: 13px; color: #66666e; font-variant-numeric: tabular-nums; min-height: 1.5em; }
</style>
</head>
<body>
<div id="root"></div>
<div id="status">
  <div id="status-text">Loading Acidulous…</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="amount"></div>
</div>
<script>
  // Download progress for the engine, the app and its graphics (about twenty
  // megabytes), against the sizes the build writes next to the page
  // (load-sizes.json, see web/app/build.gradle.kts). Both WebAssembly loaders
  // use fetch, so each response is counted as it streams in. The two scripts
  // count once they've loaded.
  const loading = (() => {
    const text = document.getElementById('status-text');
    const bar = document.getElementById('bar');
    const fill = document.getElementById('fill');
    const amount = document.getElementById('amount');
    const seen = {};
    const finished = new Set();
    let sizes = null;
    let drawing = false;
    const mb = (n) => (n / 1048576).toFixed(1);
    const draw = () => {
      drawing = false;
      let have = 0, total = 0;
      if (sizes) {
        for (const [name, size] of Object.entries(sizes)) {
          total += size;
          have += finished.has(name) ? size : Math.min(seen[name] || 0, size);
        }
      } else {
        for (const name in seen) have += seen[name];
      }
      if (have === 0) return;
      if (total > 0) {
        bar.style.visibility = 'visible';
        fill.style.width = (100 * have / total).toFixed(1) + '%';
        amount.textContent = have >= total ? mb(total) + ' MB' : mb(have) + ' of ' + mb(total) + ' MB';
        // All downloaded. What's left is compiling and starting the app.
        if (have >= total) text.textContent = 'Starting Acidulous…';
      } else {
        amount.textContent = mb(have) + ' MB';
      }
    };
    const redraw = () => { if (!drawing) { drawing = true; requestAnimationFrame(draw); } };
    const realFetch = window.fetch.bind(window);
    realFetch('load-sizes.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null)).catch(() => null)
      .then((s) => { sizes = s; redraw(); });
    window.fetch = async (input, init) => {
      const response = await realFetch(input, init);
      const name = new URL(typeof input === 'string' ? input : (input.url || String(input)), location.href)
        .pathname.split('/').pop();
      if (!/\.(wasm|js)$/.test(name) || !response.ok || !response.body || finished.has(name)) return response;
      const counted = response.body.pipeThrough(new TransformStream({
        transform(chunk, out) {
          seen[name] = (seen[name] || 0) + chunk.byteLength;
          redraw();
          out.enqueue(chunk);
        },
        flush() {
          finished.add(name);
          redraw();
        },
      }));
      return new Response(counted, { status: response.status, statusText: response.statusText, headers: response.headers });
    };
    return {
      done(name) { finished.add(name); redraw(); },
      /** Shows an error message in place of the progress bar. */
      fail(message) { text.textContent = message; bar.style.display = 'none'; amount.textContent = ''; },
    };
  })();
</script>
<script src="acidulous.js"></script>
<script>
  loading.done('acidulous.js');
  // Load the engine module on shared memory as globalThis.acid, then mount the
  // app's folder /data from browser storage, then load the app. /data is saved
  // back shortly after the app changes it, every ten seconds for what the
  // engine writes, and when the tab is hidden.
  // Without isolation there's no shared memory and no engine. Either the
  // service worker is about to reload the page, or the browser doesn't support it.
  if (!window.crossOriginIsolated) {
    setTimeout(() => {
      loading.fail('This browser is not giving the page the isolation it needs to run the engine. ' +
        'Try reloading, or a current Chrome, Edge or Firefox outside a private window.');
    }, 4000);
  } else AcidEngine().then((engine) => {
    globalThis.acid = engine;
    const FS = engine.FS;
    FS.mkdirTree('/data');
    FS.mount(engine.IDBFS, {}, '/data');
    FS.syncfs(true, (err) => {
      if (err) console.warn('Acidulous: the saved files could not be read', err);
      let busy = false, again = false, timer = 0;
      const save = () => {
        if (busy) { again = true; return; }
        busy = true;
        FS.syncfs(false, (e) => {
          busy = false;
          if (e) console.warn('Acidulous: the files could not be saved', e);
          if (again) { again = false; save(); }
        });
      };
      globalThis.acidFsChanged = () => { clearTimeout(timer); timer = setTimeout(save, 500); };
      setInterval(save, 10000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
      // Sound can only start from a user gesture, so the first touch or key starts it.
      const wake = () => engine._acid_resume();
      addEventListener('pointerdown', wake, true);
      addEventListener('keydown', wake, true);
      const ui = document.createElement('script');
      ui.src = 'acidulous-ui.js';
      ui.onload = () => {
        loading.done('acidulous-ui.js');
        // Once started, have the service worker cache the rest of the app.
        setTimeout(() => navigator.serviceWorker?.controller?.postMessage('fill'), 5000);
        // When installed, ask for persistent storage so songs aren't cleared
        // when space runs low. Only asked then, since some browsers prompt.
        if (matchMedia('(display-mode: standalone)').matches) navigator.storage?.persist?.();
      };
      document.body.appendChild(ui);
    });
  });
</script>
</body>
</html>
